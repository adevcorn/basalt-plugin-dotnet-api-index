# WASM guest plugins call host imports (basalt_* ) that the wasmtime
# Linker provides at runtime under module "env". rust-lld must leave them
# as imports instead of erroring on undefined symbols.
# NOTE: build with --target wasm32-unknown-unknown. The wasip1 target pulls
# WASI imports that core's capability-plugin linker does not provide, so
# wasip1 modules fail to instantiate (parsers are the exception: they load
# in the WASI-enabled parser linker).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-args=--allow-undefined"]
